[workspace]
members = [
    "crates/kernel",
    "crates/protocol",
    "crates/runtime",
    "crates/event_bus",
    "crates/scheduler",
    "crates/registry",
    "crates/state",
    "crates/health",
    "crates/config",
    "crates/logging",
    "crates/security",
    "crates/errors",
    "crates/metrics",
    "crates/tracing",
    "crates/plugin_api",
    "crates/bootstrap",
    "apps/aesd",
    "apps/test-runner",  # <-- Added this line
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AES Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
env_logger = "0.10"
tokio = { version = "1.0", features = ["full"] }
